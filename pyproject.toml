[project]
name = "http-server-from-scratch"
version = "0.1.0"
description = "Educational HTTP/1.1 server built from scratch on raw TCP sockets — selectors, incremental parser, keep-alive and TLS"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ZuroKing", email = "zuroking69@gmail.com" }]
maintainers = [{ name = "ZuroKing", email = "zuroking69@gmail.com" }]
keywords = ["http", "http-server", "tcp", "sockets", "selectors", "tls", "educational", "portfolio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Education",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ZuroKing/http-server-from-scratch"
Repository = "https://github.com/ZuroKing/http-server-from-scratch"
Issues = "https://github.com/ZuroKing/http-server-from-scratch/issues"
Changelog = "https://github.com/ZuroKing/http-server-from-scratch/blob/main/ARCHITECTURE.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/http_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
